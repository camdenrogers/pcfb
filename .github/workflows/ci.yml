name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Fork pull requests get no OIDC token, so they run the checks but not the plan.
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/595106518535/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-planner@pcfb-platform.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Plan
        id: plan
        run: |
          set +e
          scripts/tf.sh init -input=false -lockfile=readonly -no-color >init.log 2>&1 || { cat init.log; exit 1; }
          scripts/tf.sh plan -input=false -lock=false -no-color -out=ci.tfplan >plan.log 2>&1
          code=$?
          cat plan.log
          if [ $code -eq 0 ]; then
            scripts/tf.sh show -json ci.tfplan | python3 scripts/check_plan.py
            code=$?
          fi
          exit $code
      - name: Comment
        if: always() && hashFiles('plan.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          marker='<!-- terraform-plan -->'
          {
            echo "$marker"
            echo "### Terraform plan for \`infra/platform\`: $OUTCOME"
            echo
            grep -E '^(Plan:|No changes)' plan.log || true
            echo
            echo '<details><summary>Full output</summary>'
            echo
            echo '```'
            head -c 55000 plan.log
            echo
            echo '```'
            echo '</details>'
          } >comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
