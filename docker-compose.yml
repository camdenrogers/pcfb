services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcfb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcfb}
      POSTGRES_DB: ${POSTGRES_DB:-pcfb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pcfb}:${POSTGRES_PASSWORD:-pcfb}@db:5432/${POSTGRES_DB:-pcfb}
      CFBD_API_KEY: ${CFBD_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      HISTORY_SEASONS: ${HISTORY_SEASONS:-4}
      AUTO_BOOTSTRAP: ${AUTO_BOOTSTRAP:-true}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
