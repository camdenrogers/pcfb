env: ""

image:
  registry: us-central1-docker.pkg.dev/pcfb-platform/pcfb
  tag: ""

backend:
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 384Mi}

frontend:
  resources:
    requests: {cpu: 5m, memory: 16Mi}
    limits: {memory: 64Mi}

refresh:
  schedule: "0 10 * * *"
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {memory: 512Mi}

historySeasons: "4"
