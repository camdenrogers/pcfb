apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "pcfb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        {{- include "pcfb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: {{ include "pcfb.image" (dict "root" . "name" "backend") }}
          env: {{- include "pcfb.backendEnv" . | nindent 12 }}
          envFrom:
            - secretRef: {name: pcfb-secrets}
          ports:
            - {name: http, containerPort: 8000}
          # /api/health never queries the database, so probes don't keep Neon awake.
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
          securityContext: {{- include "pcfb.backendSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
# Must be named "backend": frontend/nginx.conf proxies to http://backend:8000.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {{- include "pcfb.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
