# No auth block: External Secrets uses the server node's attached service account.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels: {app: pcfb, env: shared}
spec:
  conditions:
    - namespaces: [pcfb-test, pcfb-prod, cloudflared]
  provider:
    gcpsm:
      projectID: pcfb-platform
