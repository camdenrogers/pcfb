apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pcfb-secrets
  labels: {{- include "pcfb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: gcp-secret-manager}
  target: {name: pcfb-secrets}
  data:
    - secretKey: CFBD_API_KEY
      remoteRef: {key: cfbd-api-key}
    - secretKey: ADMIN_TOKEN
      remoteRef: {key: admin-token-{{ .Values.env }}}
    - secretKey: DATABASE_URL
      remoteRef: {key: database-url-{{ .Values.env }}}
